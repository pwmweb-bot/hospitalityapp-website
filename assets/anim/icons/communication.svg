<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A message is posted and read across the team">
  <style>
    .dot{animation:dot 1.5s ease-in-out infinite}
    @keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
    .d2{animation-delay:.2s}.d3{animation-delay:.4s}
    .reply{transform-box:fill-box;transform-origin:center;animation:reply 3s ease-in-out infinite}
    @keyframes reply{0%,45%{transform:scale(0);opacity:0}58%{transform:scale(1.15);opacity:1}70%{transform:scale(.97)}80%,100%{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){.dot,.reply{animation:none;opacity:1}.reply{transform:scale(1)}}
  </style>
  <path d="M11 14 h34 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-20 l-9 8 v-8 h-1 a4 4 0 0 1 -4 -4 v-16 a4 4 0 0 1 4 -4 z" fill="none" stroke="#1A1612" stroke-width="3" stroke-linejoin="round"/>
  <circle class="dot" cx="22" cy="26" r="3" fill="#1A1612"/>
  <circle class="dot d2" cx="30" cy="26" r="3" fill="#1A1612"/>
  <circle class="dot d3" cx="38" cy="26" r="3" fill="#1A1612"/>
  <g class="reply">
    <circle cx="48" cy="46" r="11" fill="#E97D45"/>
    <path d="M43 46 l3.4 3.4 6.2 -7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
