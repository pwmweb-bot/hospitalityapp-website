<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A compliance checklist ticks itself off">
  <style>
    .tick{transform-box:fill-box;transform-origin:center;animation:tick 3.4s ease-in-out infinite}
    @keyframes tick{0%,10%{transform:scale(0);opacity:0}22%{transform:scale(1.15);opacity:1}30%,90%{transform:scale(1);opacity:1}97%,100%{opacity:0}}
    .t2{animation-delay:.35s}.t3{animation-delay:.7s}
    @media (prefers-reduced-motion:reduce){.tick{animation:none;transform:scale(1);opacity:1}}
  </style>
  <rect x="14" y="10" width="36" height="46" rx="5" fill="none" stroke="#1A1612" stroke-width="3"/>
  <rect x="25" y="6" width="14" height="8" rx="3" fill="#1A1612"/>
  <g><circle class="tick" cx="23" cy="24" r="5.2" fill="#5B8C6E"/><path class="tick" d="M20.6 24 l1.8 1.8 3 -3.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="31" y="22" width="14" height="3.4" rx="1.7" fill="#C9C1B0"/>
  <g><circle class="tick t2" cx="23" cy="35" r="5.2" fill="#5B8C6E"/><path class="tick t2" d="M20.6 35 l1.8 1.8 3 -3.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="31" y="33" width="14" height="3.4" rx="1.7" fill="#C9C1B0"/>
  <g><circle class="tick t3" cx="23" cy="46" r="5.2" fill="#5B8C6E"/><path class="tick t3" d="M20.6 46 l1.8 1.8 3 -3.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="31" y="44" width="11" height="3.4" rx="1.7" fill="#C9C1B0"/>
</svg>
