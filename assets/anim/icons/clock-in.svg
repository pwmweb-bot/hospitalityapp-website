<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A clock hand sweeps and a clock-in is confirmed">
  <style>
    .hand{transform-box:fill-box;transform-origin:32px 33px;animation:sweep 3s linear infinite}
    @keyframes sweep{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .pop{transform-box:fill-box;transform-origin:center;animation:pop 3s ease-in-out infinite}
    @keyframes pop{0%,50%{transform:scale(0);opacity:0}62%{transform:scale(1.18);opacity:1}72%{transform:scale(.96)}82%,100%{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){.hand,.pop{animation:none}.pop{transform:scale(1);opacity:1}}
  </style>
  <circle cx="32" cy="33" r="20" fill="none" stroke="#1A1612" stroke-width="3"/>
  <line x1="32" y1="33" x2="32" y2="20" stroke="#1A1612" stroke-width="2.4" stroke-linecap="round"/>
  <line class="hand" x1="32" y1="33" x2="43" y2="33" stroke="#E97D45" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="33" r="2.6" fill="#1A1612"/>
  <g class="pop">
    <circle cx="49" cy="16" r="10" fill="#5B8C6E"/>
    <path d="M44 16 l3.4 3.4 6.4 -7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
