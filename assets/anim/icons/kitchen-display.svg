<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A kitchen ticket appears on the rail and is bumped complete">
  <style>
    .ln{opacity:0;animation:ln 3.2s ease-out infinite}
    @keyframes ln{0%,10%{opacity:0}20%,88%{opacity:1}96%,100%{opacity:0}}
    .l2{animation-delay:.16s}.l3{animation-delay:.32s}
    .bump{transform-box:fill-box;transform-origin:center;animation:bump 3.2s ease-in-out infinite}
    @keyframes bump{0%,54%{transform:scale(0);opacity:0}66%{transform:scale(1.18);opacity:1}76%{transform:scale(.96)}84%,100%{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){.ln,.bump{animation:none;opacity:1}.bump{transform:scale(1)}}
  </style>
  <line x1="8" y1="14" x2="56" y2="14" stroke="#1A1612" stroke-width="3" stroke-linecap="round"/>
  <circle cx="18" cy="14" r="3.2" fill="#1A1612"/><circle cx="46" cy="14" r="3.2" fill="#1A1612"/>
  <rect x="16" y="20" width="32" height="34" rx="4" fill="none" stroke="#1A1612" stroke-width="3"/>
  <rect x="16" y="20" width="32" height="8" rx="4" fill="#E97D45"/>
  <rect class="ln" x="21" y="33" width="18" height="3.4" rx="1.7" fill="#C9C1B0"/>
  <rect class="ln l2" x="21" y="40" width="22" height="3.4" rx="1.7" fill="#C9C1B0"/>
  <rect class="ln l3" x="21" y="47" width="14" height="3.4" rx="1.7" fill="#C9C1B0"/>
  <g class="bump">
    <circle cx="47" cy="47" r="11" fill="#5B8C6E"/>
    <path d="M42 47 l3.4 3.4 6.2 -7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
