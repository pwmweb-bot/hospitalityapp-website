<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Coins dropping into a shared tronc pot">
  <style>
    .drop{transform-box:fill-box;transform-origin:center;animation:drop 2.8s ease-in infinite}
    @keyframes drop{0%{transform:translateY(-22px);opacity:0}14%{opacity:1}40%{transform:translateY(0);opacity:1}52%,100%{transform:translateY(0);opacity:0}}
    .d2{animation-delay:.5s}.d3{animation-delay:1s}
    @media (prefers-reduced-motion:reduce){.drop{animation:none;opacity:1;transform:none}}
  </style>
  <path d="M14 34 h36 v10 a10 10 0 0 1 -10 10 h-16 a10 10 0 0 1 -10 -10 z" fill="none" stroke="#1A1612" stroke-width="3" stroke-linejoin="round"/>
  <rect x="10" y="28" width="44" height="8" rx="4" fill="#1A1612"/>
  <g class="drop"><circle cx="24" cy="20" r="7" fill="#E97D45"/><text x="24" y="24.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" fill="#fff">£</text></g>
  <g class="drop d2"><circle cx="40" cy="20" r="7" fill="#5B8C6E"/><text x="40" y="24.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" fill="#fff">£</text></g>
  <g class="drop d3"><circle cx="32" cy="20" r="7" fill="#E97D45"/><text x="32" y="24.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" fill="#fff">£</text></g>
</svg>
