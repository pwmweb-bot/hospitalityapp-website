<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="An order on the till is confirmed with a tick">
  <style>
    .pay{transform-box:fill-box;transform-origin:center;animation:pay 3s ease-in-out infinite}
    @keyframes pay{0%,45%{opacity:0;transform:scale(0)}58%{opacity:1;transform:scale(1.15)}70%{transform:scale(.97)}80%,92%{transform:scale(1);opacity:1}98%,100%{opacity:0;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.pay{animation:none;opacity:1;transform:scale(1)}}
  </style>
  <rect x="10" y="12" width="44" height="40" rx="6" fill="#1A1612"/>
  <rect x="14" y="16" width="36" height="32" rx="3" fill="#F5F1E8"/>
  <rect x="18" y="21" width="18" height="4" rx="2" fill="#C9C1B0"/>
  <rect x="40" y="21" width="7" height="4" rx="2" fill="#1A1612"/>
  <rect x="18" y="28" width="14" height="4" rx="2" fill="#C9C1B0"/>
  <rect x="40" y="28" width="7" height="4" rx="2" fill="#1A1612"/>
  <rect x="18" y="35" width="16" height="4" rx="2" fill="#C9C1B0"/>
  <rect x="40" y="35" width="7" height="4" rx="2" fill="#1A1612"/>
  <g class="pay">
    <circle cx="32" cy="32" r="12" fill="#5B8C6E"/>
    <path d="M26.5 32 l3.6 3.6 7 -7.6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
