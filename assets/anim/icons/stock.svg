<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A keg fills and its stock level settles">
  <style>
    .lvl{transform-box:fill-box;transform-origin:bottom;animation:lvl 3s ease-in-out infinite}
    @keyframes lvl{0%{transform:scaleY(.25)}45%,100%{transform:scaleY(.82)}}
    .gp{transform-box:fill-box;transform-origin:center;animation:gp 3s ease-in-out infinite}
    @keyframes gp{0%,45%{transform:scale(0);opacity:0}58%{transform:scale(1.15);opacity:1}70%{transform:scale(.97)}80%,100%{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){.lvl{animation:none;transform:scaleY(.82)}.gp{animation:none;transform:scale(1);opacity:1}}
  </style>
  <clipPath id="keg"><rect x="19" y="15" width="26" height="40" rx="9"/></clipPath>
  <g clip-path="url(#keg)"><rect class="lvl" x="19" y="15" width="26" height="40" fill="#E97D45"/></g>
  <rect x="19" y="15" width="26" height="40" rx="9" fill="none" stroke="#1A1612" stroke-width="3"/>
  <line x1="19" y1="27" x2="45" y2="27" stroke="#1A1612" stroke-width="2.2"/>
  <line x1="19" y1="43" x2="45" y2="43" stroke="#1A1612" stroke-width="2.2"/>
  <g class="gp">
    <circle cx="48" cy="18" r="11" fill="#5B8C6E"/>
    <text x="48" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" fill="#fff">GP</text>
  </g>
</svg>
