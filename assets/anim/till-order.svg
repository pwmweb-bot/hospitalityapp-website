<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="An order is rung through on a tablet till and payment is confirmed with a tick">
  <style>
    .trow{opacity:0;animation:trow 3.4s ease-out infinite;transform-box:fill-box}
    @keyframes trow{0%,4%{opacity:0;transform:translateY(3px)}12%,86%{opacity:1;transform:none}94%,100%{opacity:0}}
    .tr2{animation-delay:.26s}.tr3{animation-delay:.52s}
    .pay{opacity:0;animation:pay 3.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pay{0%,30%{opacity:0;transform:scale(.92)}40%,86%{opacity:1;transform:scale(1)}94%,100%{opacity:0}}
    .tpop{transform-box:fill-box;transform-origin:center;animation:tpop 3.4s ease-in-out infinite}
    @keyframes tpop{0%,52%{transform:scale(0);opacity:0}63%{transform:scale(1.18);opacity:1}72%{transform:scale(.96)}80%,86%{transform:scale(1);opacity:1}94%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.trow,.pay,.tpop{animation:none;opacity:1}.tpop{transform:scale(1)}}
  </style>
  <rect x="16" y="38" width="128" height="84" rx="11" fill="#1A1612"/>
  <rect x="22" y="44" width="116" height="72" rx="6" fill="#F5F1E8"/>
  <rect class="trow" x="30" y="52" width="66" height="7" rx="3.5" fill="#C9C1B0"/>
  <rect class="trow" x="106" y="52" width="24" height="7" rx="3.5" fill="#1A1612"/>
  <rect class="trow tr2" x="30" y="64" width="54" height="7" rx="3.5" fill="#C9C1B0"/>
  <rect class="trow tr2" x="106" y="64" width="24" height="7" rx="3.5" fill="#1A1612"/>
  <rect class="trow tr3" x="30" y="76" width="60" height="7" rx="3.5" fill="#C9C1B0"/>
  <rect class="trow tr3" x="106" y="76" width="24" height="7" rx="3.5" fill="#1A1612"/>
  <g class="pay">
    <rect x="30" y="94" width="100" height="16" rx="8" fill="#E97D45"/>
    <rect x="62" y="100" width="36" height="4" rx="2" fill="#F5F1E8"/>
  </g>
  <g class="tpop">
    <circle cx="80" cy="80" r="20" fill="#5B8C6E"/>
    <path d="M71 80 l6 6 12 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
